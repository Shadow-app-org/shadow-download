name: Publish Founder-approved Shadow repository
on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: SHA256 of reviewed delivery/site/deployment-manifest.json
        required: true
        type: string
      approval:
        description: Type PUBLISH REVIEWED SHADOW CANDIDATE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shadow-pages-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Shadow-app-org/shadow-download' && github.ref == 'refs/heads/main' && inputs.approval == 'PUBLISH REVIEWED SHADOW CANDIDATE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact reviewed candidate
        env:
          APPROVED_SHA: ${{ inputs.candidate_sha256 }}
        run: test "$APPROVED_SHA" = 16a45b4ce9d9e790a51b58078cd85e58d4ad52caecce1a012b64c203a3a3b031
      - name: Require configured Founder approval and production settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/check_deployment_settings.py
      - name: Verify and stage immutable distribution
        run: |
          python3 -B tools/test_deployment.py
          python3 -B tools/test_pages_artifact.py
          python3 -B tools/test_source_indexes.py
          python3 -B tools/verify_production.py
      - name: Package verified Pages files without mutable composite dependencies
        run: python3 -B tools/package_pages.py _shadow_pages "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

name: Import verified candidate into review branch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  import-for-review:
    if: github.repository == 'Shadow-app-org/shadow-download' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deployment/shk-003-production' && github.event.pull_request.user.login == 'shadowapporg'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse to overwrite existing review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/Shadow-app-org/shadow-download/git/ref/heads/deployment/shk-003-ready >/dev/null 2>&1; then
            echo 'Destination already exists. Inspect it; never overwrite it.'
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13309941261
          merge-multiple: true
          run-id: 41805413025
          repository: Shadow-app-org/shadow-download
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shadow-verified-artifact
      - name: Validate and import into an unpublished review branch
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/shadow-verified-artifact
        run: |
          python3 -B bootstrap/import_candidate.py "$CANDIDATE_PATH"
          git switch -c deployment/shk-003-ready
          git config user.name shadowapporg
          git config user.email 352272508+shadowapporg@users.noreply.github.com
          git add -- delivery .nojekyll README.md SHA256SUMS.txt index.html script.shadow-0.0.53-dev.zip MIGRATION-VERIFICATION.json
          git commit -m 'Make verified Shadow distribution self-contained with gated Pages publication'
      - name: Push only the new review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/deployment/shk-003-ready
